{% extends "base.html" %}{% block content %}<section class="wrap section"><span class="eyebrow">CONTROL CENTER</span><h1>Product Manager</h1><div class="panel"><h2>Add Product</h2><form method="post" class="adminform"><input type="hidden" name="_csrf" value="{{csrf}}"><input name="name" placeholder="Product name" required><select name="category"><option>Men</option><option>Women</option><option>Children</option><option>Shoes</option><option>Gadgets</option><option>Accessories</option><option>Lifestyle</option></select><input name="price" type="number" min="1" placeholder="Price" required><input name="old_price" type="number" min="0" placeholder="Old price"><input name="stock" type="number" min="0" placeholder="Stock"><input name="sizes" placeholder="Sizes: S,M,L,XL or Free Size"><input name="image" placeholder="Image URL"><textarea name="description" placeholder="Product description"></textarea><button class="btn">ADD PRODUCT</button></form></div><div class="sectionhead"><h2>Current Products</h2></div>{% for p in products %}<div class="cartrow"><img src="{{p.image}}" alt="" onerror="this.style.display='none'"><div class="grow"><b>{{p.name}}</b><small>{{p.category}} • ৳{{p.price}} • stock {{p.stock}} • sizes {{p.sizes}}</small></div><form method="post" action="{{url_for('admin_delete_product',pid=p.id)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="textbtn">Hide</button></form></div>{% endfor %}</section>{% endblock %}

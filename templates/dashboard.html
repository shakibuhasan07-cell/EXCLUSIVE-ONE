{% extends "base.html" %}{% block content %}<section class="wrap section"><span class="eyebrow">ACCOUNT</span><h1>Hello, {{current_user}}</h1><div class="dashgrid"><a class="panel" href="{{url_for('orders')}}">My Orders</a><a class="panel" href="{{url_for('wishlist')}}">Wishlist</a><a class="panel" href="{{url_for('profile')}}">Profile</a>{% if is_admin %}<a class="panel" href="{{url_for('admin')}}">Admin Panel</a>{% endif %}</div><h2>Recent Orders</h2>{% for o in orders %}<div class="cartrow"><div class="grow">Order #{{o.id}}<small>{{o.created_at}}</small></div><b>৳{{o.total}}</b><span class="badge">{{o.status}}</span></div>{% else %}<p class="muted">No orders yet.</p>{% endfor %}</section>{% endblock %}

<article class="card"><a class="cardimg" href="{{url_for('product',pid=p.id)}}"><img loading="lazy" src="{{p.image}}" alt="{{p.name}}"><span class="sale">EXCLUSIVE</span></a><div class="cardbody"><small>{{p.category}}</small><h3><a href="{{url_for('product',pid=p.id)}}">{{p.name}}</a></h3><div class="price"><strong>৳{{p.price}}</strong>{% if p.old_price %}<del>৳{{p.old_price}}</del>{% endif %}</div><div class="cardactions"><a class="btn small" href="{{url_for('product',pid=p.id)}}">View & Buy</a><form method="post" action="{{url_for('wishlist_toggle',pid=p.id)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="heart" title="Wishlist">♡</button></form></div></div></article>

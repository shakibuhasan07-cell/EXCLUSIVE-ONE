{% extends "base.html" %}{% block content %}<section class="wrap section"><span class="eyebrow">ACCOUNT</span><h1>My Orders</h1>{% for o in orders %}<a class="cartrow orderlink" href="{{url_for('order_detail',oid=o.id)}}"><div class="grow"><b>Order #{{o.id}}</b><small>{{o.created_at}}</small></div><span class="badge">{{o.status}}</span><strong>৳{{o.total}}</strong></a>{% else %}<div class="empty">No orders yet.</div>{% endfor %}</section>{% endblock %}

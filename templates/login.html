{% extends "base.html" %}{% block content %}<section class="authpage"><div class="authvisual"><span class="eyebrow">EXCLUSIVE ONE</span><h1>Welcome<br><em>back.</em></h1><p>Sign in with your email or Bangladesh mobile number and continue shopping.</p></div><div class="auth panel"><span class="eyebrow">ACCOUNT ACCESS</span><h2>Login</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>Email or mobile number<input name="identifier" autocomplete="username" placeholder="email@example.com / 01XXXXXXXXX" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="captcha"><span>Security check: <b>{{session.get('captcha_question')}}</b></span><input name="captcha" inputmode="numeric" placeholder="Answer" required></div><button class="btn wide">LOGIN SECURELY</button></form><a class="forgotlink" href="{{url_for('forgot')}}">Forgot password?</a><p>New here? <a href="{{url_for('signup')}}">Create an account</a></p></div></section>{% endblock %}

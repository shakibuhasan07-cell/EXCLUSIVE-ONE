{% extends "base.html" %}{% block content %}<section class="wrap section"><span class="eyebrow">CONTROL CENTER</span><h1>Admin Dashboard</h1><div class="stats"><div><b>{{stats.users}}</b><small>Users</small></div><div><b>{{stats.orders}}</b><small>Orders</small></div><div><b>৳{{stats.sales}}</b><small>Sales</small></div><div><b>{{stats.products}}</b><small>Products</small></div></div><p><a class="btn" href="{{url_for('admin_products')}}">Manage Products</a></p><h2>Recent Orders</h2>{% for o in recent %}<div class="cartrow"><div class="grow">#{{o.id}} • {{o.name}}<small>৳{{o.total}}</small></div><form method="post" action="{{url_for('admin_order_status',oid=o.id)}}"><input type="hidden" name="_csrf" value="{{csrf}}"><select name="status" onchange="this.form.submit()">{% for s in ['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'] %}<option {% if o.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></form></div>{% endfor %}</section>{% endblock %}
